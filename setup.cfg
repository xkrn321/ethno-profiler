[metadata]
name = ethno-profiler
version = 1.0.0
description = Exploratory PubMed publication-count profiling for ethnomedicine research
author = 许库兰·阿不都许库尔
license = MIT
python_requires = >=3.9

[options]
packages = ethno_profiler
